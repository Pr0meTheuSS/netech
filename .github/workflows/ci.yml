# CI для hw-1: сборка + ctest на матрице компиляторов и конфигураций.
# Зелёные все четыре джоба — задание сдано.
name: CI

on: [push, pull_request]   # каждый push в любую ветку и каждый pull request

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} / ${{ matrix.build-type }}
    runs-on: ubuntu-latest
    strategy:
      # Показываем результаты всей матрицы, а не останавливаемся
      # на первом провале.
      fail-fast: false
      matrix:
        compiler: [gcc, clang]        # оба предустановлены на ubuntu-latest
        build-type: [Debug, Release]
        dir: [hw1]
    env:
      # CMake выбирает компилятор по переменной окружения CC.
      CC: ${{ matrix.compiler }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        working-directory: ${{ matrix.dir }}
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}

      - name: Build
        working-directory: ${{ matrix.dir }}
        run: cmake --build build --parallel

      - name: Test
        working-directory: ${{ matrix.dir }}
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: gcc / ASan + UBSan + LeakSan
    runs-on: ubuntu-latest
    env:
      CC: gcc
      # LeakSanitizer на Linux входит в состав ASan; поиск утечек включаем
      # явно. UBSan делаем фатальным, чтобы джоб краснел на любом UB.
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (Debug + санитайзеры)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # --- Проверка памяти: valgrind (memcheck) ----------------------------
  valgrind:
    name: gcc / valgrind memcheck
    runs-on: ubuntu-latest
    env:
      CC: gcc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install valgrind
        run: sudo apt-get update -qq && sudo apt-get install -y -qq valgrind

      - name: Configure (Debug, с отладочными символами)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel

      - name: Test under valgrind
        run: |
          valgrind --leak-check=full --show-leak-kinds=all \
                   --errors-for-leak-kinds=definite,indirect \
                   --track-origins=yes --error-exitcode=1 \
                   ./build/test_hw1
